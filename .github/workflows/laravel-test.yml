name : "laravel automate test runner"

on: [push, pull_request]

jobs:
  laravel-test:
    runs-on: ubuntu-latest

    steps:
        - name: "Checkout code"
        - uses: actions/checkout@v2

        - name: "Setup PHP"
        - uses: "shivammathur/setup-php@v2"
           with :
              php-version: "8.2"
              extensions: mbstring, bcmath, pdo_mysql

